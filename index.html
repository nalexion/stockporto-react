<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StocksPortofolio</title>
    <meta name="description" content="A full-stack web application to track stock portfolios, import CSVs, and monitor P&L." />
    <meta property="og:title" content="StocksPortofolio" />
    <meta property="og:description" content="A full-stack web application to track stock portfolios, import CSVs, and monitor P&L." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var target = e && e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var src = target.src || target.href || '';
          if (src.indexOf('/assets/') !== -1 && !sessionStorage.getItem('gh_pages_cache_busted')) {
            sessionStorage.setItem('gh_pages_cache_busted', '1');
            window.location.replace(window.location.pathname + '?v=' + Date.now() + window.location.hash);
          }
        }
      }, true);
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
